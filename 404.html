<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷路了 | 404</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="error-page fade-in">
            <div class="error-code flicker">404</div>
            <h1 style="color: var(--color-blood-bright); font-size: 1.4rem;">这里什么都没有</h1>
            <p class="no-indent" style="color: var(--color-text-dim); margin-top: 16px;">
                ——或者说，这里曾经有过什么。
            </p>
            <p class="no-indent" style="color: var(--color-text-dim); margin-top: 8px; font-size: 0.9rem;">
                你走错路了。又或者……路走错你了。
            </p>
            <div style="margin-top: 40px;">
                <a href="index.html" class="btn">回到入口</a>
            </div>
            <p class="no-indent" style="color: var(--color-text-faint); font-size: 0.75rem; margin-top: 50px;">
                提示：真正的入口往往藏在看得见的地方。<br>
                试着去看看首页的"源代码"——有些话，只说给愿意低头看的人。
            </p>
        </div>
    </div>

    <script src="js/arg.js"></script>
</body>
</html>
